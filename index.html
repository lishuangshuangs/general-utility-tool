<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>实用工具箱</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 10px;
      color: #2563eb;
    }

    .tool {
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
    }

    textarea {
      width: 100%;
      min-height: 160px;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-right: 8px;
      padding: 10px 18px;
      color: white;
      background: #2563eb;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      line-height: 1.8;
      background: #eff6ff;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>实用工具箱</h1>
      <p>一些简单、方便的在线工具</p>
    </header>

    <main class="tool">
      <h2>文本统计工具</h2>
      <p>输入文字后，可以统计字符数、字数和行数。</p>

      <textarea
        id="textInput"
        placeholder="请在这里输入文字……"
        oninput="countText()"
      ></textarea>

      <button onclick="countText()">开始统计</button>
      <button onclick="clearText()">清空内容</button>

      <div class="result">
        字符数：<strong id="characterCount">0</strong><br>
        非空字符数：<strong id="nonSpaceCount">0</strong><br>
        行数：<strong id="lineCount">0</strong>
      </div>
    </main>
  </div>

  <script>
    function countText() {
      const text = document.getElementById("textInput").value;

      document.getElementById("characterCount").textContent =
        text.length;

      document.getElementById("nonSpaceCount").textContent =
        text.replace(/\s/g, "").length;

      document.getElementById("lineCount").textContent =
        text.length === 0 ? 0 : text.split(/\r?\n/).length;
    }

    function clearText() {
      document.getElementById("textInput").value = "";
      countText();
    }
  </script>
</body>
</html>
