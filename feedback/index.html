<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>功能建议 - Utilora</title><link rel="stylesheet" href="../assets/css/site.css"></head><body><header class="tool-head"><nav><a class="brand" href="../">Utilora</a><a href="../">返回首页</a></nav></header><main class="tool-main"><div class="panel"><h1>功能建议</h1><p class="hint">告诉我们你希望 Utilora 增加什么工具。提交后将打开 GitHub，你需要登录 GitHub 完成留言。</p><form id="form"><div class="field"><label for="title">想增加的功能</label><input id="title" required maxlength="100" placeholder="例如：二维码生成器"></div><div class="field"><label for="detail">使用场景或详细说明</label><textarea id="detail" required maxlength="2000" placeholder="请描述你希望它解决什么问题……"></textarea></div><button type="submit">前往 GitHub 提交建议</button></form><div class="result">建议会公开显示在项目的 GitHub Issues 中，请勿填写手机号、邮箱、密码等隐私信息。</div></div></main><script src="feedback.js"></script></body></html>
