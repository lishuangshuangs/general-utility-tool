<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片压缩 - Utilora</title>
  <meta name="description" content="在浏览器中压缩图片、转为 WebP 或 Base64，并去除 EXIF，不上传原图。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .dropzone{display:grid;min-height:180px;place-items:center;padding:28px;color:#64748b;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;text-align:center;cursor:pointer}
    .dropzone.drag{border-color:#818cf8;background:#eef2ff;color:#4f46e5}
    .dropzone b{display:block;margin-bottom:6px;color:#111827;font-size:16px}
    .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
    .preview-card{overflow:hidden;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px}
    .preview-card img,.preview-card canvas{display:block;width:100%;max-height:280px;object-fit:contain;background:#fff}
    .preview-card p{margin:0;padding:10px 12px;color:#64748b;font-size:13px}
    .preview-card strong{color:#111827}
    #file{display:none}
    @media(max-width:650px){.preview-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>图片压缩</h1>
      <p class="hint">压缩 JPG / PNG / WebP，转为 WebP 或 Base64，并去掉 EXIF 位置信息。图片只在你的浏览器里处理，不会上传。</p>
      <label class="dropzone" id="dropzone" for="file">
        <span><b>拖入、点选或粘贴图片</b>支持 JPG、PNG、WebP，最大 20 MB</span>
      </label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      <div class="grid" style="margin-top:16px">
        <div class="field">
          <label for="quality">画质 <span id="qualityText">0.75</span></label>
          <input id="quality" type="range" min="0.4" max="0.95" step="0.05" value="0.75">
        </div>
        <div class="field">
          <label for="maxWidth">最长边</label>
          <select id="maxWidth">
            <option value="0">保持原尺寸</option>
            <option value="1920">1920 px</option>
            <option value="1280" selected>1280 px</option>
            <option value="800">800 px</option>
          </select>
        </div>
        <div class="field">
          <label for="format">输出格式</label>
          <select id="format">
            <option value="image/webp">WebP</option>
            <option value="image/jpeg" selected>JPEG</option>
            <option value="image/png">PNG</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="download" disabled>下载压缩图</button>
        <button id="copyBase64" class="secondary" disabled>复制 Base64</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
      <div id="compare" class="preview-grid" hidden>
        <div class="preview-card"><img id="beforeImg" alt="原图"><p>原图 <strong id="beforeMeta">—</strong></p></div>
        <div class="preview-card"><img id="afterImg" alt="压缩后"><p>压缩后 <strong id="afterMeta">—</strong></p></div>
      </div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../qr-code/">二维码生成</a>
      <a href="../base64/">Base64 编解码</a>
      <a href="../color-converter/">颜色转换</a>
    </div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="image-compress"></script>
</body>
</html>
