<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON 转 TypeScript 类型 - Utilora</title>
  <meta name="description" content="将 JSON 示例转为 TypeScript interface 或 type，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>JSON 转 TypeScript 类型</h1>
      <p class="hint">粘贴 JSON，自动推断并生成 TypeScript interface。支持嵌套对象与数组。内容只在浏览器中处理。</p>
      <div class="field">
        <label for="input">JSON</label>
        <textarea id="input" spellcheck="false" placeholder='{"name":"Utilora","count":3,"tags":["tool"]}'></textarea>
      </div>
      <div class="field">
        <label for="name">类型名称</label>
        <input id="name" type="text" value="Root" placeholder="Root">
      </div>
      <div class="actions">
        <button id="convert" type="button">生成类型</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="copy" class="secondary" type="button">复制</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="output">TypeScript</label>
        <textarea id="output" spellcheck="false" readonly placeholder="生成结果将显示在这里"></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../json-formatter/">JSON 格式化</a>
      <a href="../data-convert/">JSON / YAML / CSV</a>
      <a href="../jwt-decoder/">JWT 解码</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="json-to-ts"></script>
</body>
</html>
