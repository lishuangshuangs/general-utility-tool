<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本去重 - Utilora</title>
  <meta name="description" content="去除重复行或重复词，支持按行、按空格分词，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>文本去重</h1>
      <p class="hint">去除重复行或重复词，保留首次出现顺序。适合清理名单、日志、关键词列表。</p>
      <div class="field">
        <label for="input">输入文本</label>
        <textarea id="input" placeholder="每行一项，或用空格分隔的词……"></textarea>
      </div>
      <div class="field">
        <label for="mode">去重方式</label>
        <select id="mode">
          <option value="line">按行去重</option>
          <option value="word">按空格分词去重</option>
          <option value="line-trim">按行去重（忽略首尾空白）</option>
          <option value="line-case">按行去重（忽略大小写）</option>
        </select>
      </div>
      <div class="actions">
        <button id="run" type="button">去重</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
      </div>
      <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px">
        <div class="stat"><strong id="before">0</strong>处理前</div>
        <div class="stat"><strong id="after">0</strong>处理后</div>
        <div class="stat"><strong id="removed">0</strong>去除</div>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="output">结果</label>
        <textarea id="output" readonly></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-counter/">文本统计</a>
      <a href="../text-diff/">文本对比</a>
      <a href="../case-converter/">大小写转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="text-dedup"></script>
</body>
</html>
