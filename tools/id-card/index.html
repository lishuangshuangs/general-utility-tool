<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>身份证校验 - Utilora</title>
  <meta name="description" content="在浏览器中校验身份证号码结构，读出生日、性别与省份，不联网查询。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head"><nav><a class="brand" href="../../">Utilora</a><a href="../../feedback/">功能建议</a></nav></header>
  <main class="tool-main">
    <div class="panel">
      <h1>身份证校验</h1>
      <p class="hint">只在浏览器里校验结构，不会联网查询或保存。</p>
      <div class="field"><label for="input">身份证号</label><input id="input" class="mono" placeholder="11010519491231002X" autocomplete="off" spellcheck="false"></div>
      <div id="stats" class="stats" hidden></div>
      <div class="actions">
        <button id="sample" class="secondary">示例</button>
        <button id="copy" class="secondary">复制结果</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message">输入号码后即时校验</div>
    </div>
    <div class="related"><span>相关工具</span><a href="../number-chinese/">数字转中文大写</a><a href="../zh-convert/">简繁拼音</a><a href="../text-counter/">文本统计</a></div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="id-card"></script>
</body>
</html>
