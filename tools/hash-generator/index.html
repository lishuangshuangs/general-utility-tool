<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash 生成器 - Utilora</title><link rel="stylesheet" href="../../assets/css/site.css"></head><body><header class="tool-head"><nav><a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a><a href="../../">返回首页</a></nav></header><main class="tool-main"><section class="panel"><h1>Hash 生成器</h1><p class="hint">为 UTF-8 文本生成 SHA 摘要。Hash 不可逆，不能用于还原原文。</p><div class="field"><label for="input">输入文本</label><textarea id="input" placeholder="输入要计算摘要的文本……"></textarea></div><div class="field"><label for="algorithm">算法</label><select id="algorithm"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select></div><div class="actions"><button id="generate">生成 Hash</button><button id="copy" class="secondary">复制结果</button></div><div id="message" class="message"></div><div id="output" class="result output">—</div></section></main><script src="tool.js"></script></body></html>
