<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTTP 状态码查询 - Utilora</title>
  <meta name="description" content="查询常见 HTTP 状态码含义与说明，本地数据不联网。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .status-list{display:grid;gap:8px;margin-top:16px}
    .status-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#f8fafc;border:1px solid var(--line);border-radius:10px}
    .status-item code{flex:0 0 48px;font-weight:800;font-size:16px;color:var(--primary)}
    .status-item strong{display:block;font-size:14px}
    .status-item span{color:var(--muted);font-size:13px;line-height:1.5}
    .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
    .filter-row button{font-size:13px}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>HTTP 状态码查询</h1>
      <p class="hint">按状态码或关键词快速查找常见 HTTP 状态码的含义与使用场景。数据内置，无需联网。</p>
      <div class="field">
        <label for="search">搜索状态码或关键词</label>
        <input id="search" type="search" placeholder="例如 404、Not Found、重定向…" autocomplete="off">
      </div>
      <div class="filter-row">
        <button type="button" class="secondary active" data-group="all">全部</button>
        <button type="button" class="secondary" data-group="1">1xx 信息</button>
        <button type="button" class="secondary" data-group="2">2xx 成功</button>
        <button type="button" class="secondary" data-group="3">3xx 重定向</button>
        <button type="button" class="secondary" data-group="4">4xx 客户端错误</button>
        <button type="button" class="secondary" data-group="5">5xx 服务端错误</button>
      </div>
      <div id="list" class="status-list"></div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../url-parser/">URL 解析器</a>
      <a href="../jwt-decoder/">JWT 解码</a>
      <a href="../user-agent/">User-Agent 解析</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="http-status"></script>
</body>
</html>
