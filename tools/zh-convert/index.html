<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>简繁拼音 - Utilora</title>
  <meta name="description" content="简体繁体互转、汉字转拼音和 URL slug，全部在浏览器本地完成。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>简繁拼音</h1>
      <p class="hint">简体 / 繁体互转，并生成拼音或 URL slug。适合起名、文件名和链接。字库来自 OpenCC 单字表，常用字覆盖完整。</p>
      <div class="field">
        <label for="input">原文</label>
        <textarea id="input" placeholder="请输入中文……"></textarea>
      </div>
      <div class="actions">
        <button data-mode="s2t">简体 → 繁体</button>
        <button data-mode="t2s">繁体 → 简体</button>
        <button data-mode="pinyin" class="secondary">转拼音</button>
        <button data-mode="slug" class="secondary">转 slug</button>
        <button id="sample" class="secondary">示例</button>
        <button id="copy" class="secondary">复制结果</button>
        <button id="swap" class="secondary">结果填回</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="output">结果</label>
        <textarea id="output" readonly></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../case-converter/">大小写转换</a>
      <a href="../text-counter/">文本统计</a>
      <a href="../html-entities/">HTML 实体</a>
    </div>
  </main>
  <script src="data.js"></script>
  <script src="pinyin.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="zh-convert"></script>
</body>
</html>
