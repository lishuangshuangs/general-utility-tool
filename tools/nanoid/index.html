<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NanoID 生成 - Utilora</title>
  <meta name="description" content="在浏览器中生成安全的 NanoID 短唯一标识，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>NanoID 生成</h1>
      <p class="hint">使用加密安全随机数生成短小、URL 友好的唯一 ID。默认字母表与官方 NanoID 一致。</p>
      <div class="grid">
        <div class="field">
          <label for="size">长度（8–64）</label>
          <input id="size" type="number" min="8" max="64" value="21">
        </div>
        <div class="field">
          <label for="count">数量（1–50）</label>
          <input id="count" type="number" min="1" max="50" value="5">
        </div>
      </div>
      <div class="field">
        <label for="alphabet">字母表（可选，留空使用默认）</label>
        <input id="alphabet" type="text" placeholder="A-Za-z0-9_-（默认）" spellcheck="false">
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div class="actions">
        <button id="generate" type="button">生成</button>
        <button id="copy" class="secondary" type="button">复制全部</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../uuid-generator/">UUID 生成器</a>
      <a href="../password-generator/">密码生成器</a>
      <a href="../random-number/">随机数生成器</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="nanoid"></script>
</body>
</html>
