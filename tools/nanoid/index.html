<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NanoID 生成器 - Utilora</title>
  <meta name="description" content="在浏览器中生成安全、短小的 NanoID，支持自定义长度与字符集，本地处理。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>NanoID 生成器</h1>
      <p class="hint">生成短小、URL 安全的随机 ID。使用浏览器加密随机数，适合作为主键、短链或令牌。</p>
      <div class="grid">
        <div class="field">
          <label for="size">长度（8–64）</label>
          <input id="size" type="number" min="8" max="64" value="21">
        </div>
        <div class="field">
          <label for="count">生成数量（1–50）</label>
          <input id="count" type="number" min="1" max="50" value="5">
        </div>
      </div>
      <div class="field">
        <label for="alphabet">字符集</label>
        <select id="alphabet">
          <option value="default">默认（A-Za-z0-9_-，URL 安全）</option>
          <option value="alphanum">仅字母数字</option>
          <option value="numbers">仅数字</option>
          <option value="hex">十六进制</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="field" id="custom-wrap" hidden>
        <label for="custom-alphabet">自定义字符集</label>
        <input id="custom-alphabet" type="text" placeholder="例如：ABCDEFGHJKLMNPQRSTUVWXYZ23456789" value="ABCDEFGHJKLMNPQRSTUVWXYZ23456789">
      </div>
      <textarea id="output" readonly rows="8"></textarea>
      <div class="actions">
        <button id="generate" type="button">重新生成</button>
        <button id="copy" class="secondary" type="button">复制全部</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../uuid-generator/">UUID 生成器</a>
      <a href="../password-generator/">密码生成器</a>
      <a href="../random-number/">随机数生成器</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="nanoid"></script>
</body>
</html>
