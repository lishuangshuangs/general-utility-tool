<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cookie 解析 - Utilora</title>
  <meta name="description" content="在浏览器中解析 Cookie 字符串，拆分名称与值，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .cookie-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
    .cookie-table th,.cookie-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);word-break:break-all}
    .cookie-table th{color:#475569;font-weight:700;background:#f8fafc}
    .cookie-table tr:hover td{background:#f8fafc}
    #empty-state{margin-top:16px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>Cookie 解析</h1>
      <p class="hint">粘贴浏览器 Cookie 字符串（如 document.cookie 或请求头中的 Cookie），即时拆分为名称与值。全部在本地处理。</p>
      <div class="field">
        <label for="input">Cookie 字符串</label>
        <textarea id="input" placeholder="例如：session_id=abc123; theme=dark; lang=zh-CN"></textarea>
      </div>
      <div class="actions">
        <button id="parse" type="button">解析</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
        <button id="copy-json" class="secondary" type="button">复制 JSON</button>
      </div>
      <div id="empty-state">输入 Cookie 后点击解析，结果将显示在下方。</div>
      <div id="result-wrap" hidden>
        <table class="cookie-table">
          <thead><tr><th>名称</th><th>值</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../url-parser/">URL 解析器</a>
      <a href="../jwt-decoder/">JWT 解码</a>
      <a href="../url-codec/">URL 编解码</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="cookie-parser"></script>
</body>
</html>
