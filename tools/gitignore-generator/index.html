<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>.gitignore 生成 - Utilora</title>
  <meta name="description" content="按技术栈勾选，快速生成 .gitignore 文件内容，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .stack-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
    .stack-grid label{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
    .stack-grid input{width:18px;height:18px;accent-color:var(--primary)}
    @media(max-width:650px){.stack-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:430px){.stack-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>.gitignore 生成</h1>
      <p class="hint">勾选你使用的技术栈，一键生成常用 .gitignore 规则。可复制或下载。内容仅在浏览器内生成。</p>
      <div class="stack-grid" id="stacks">
        <label><input type="checkbox" value="node" checked> Node.js</label>
        <label><input type="checkbox" value="python"> Python</label>
        <label><input type="checkbox" value="java"> Java</label>
        <label><input type="checkbox" value="go"> Go</label>
        <label><input type="checkbox" value="rust"> Rust</label>
        <label><input type="checkbox" value="dotnet"> .NET</label>
        <label><input type="checkbox" value="macos"> macOS</label>
        <label><input type="checkbox" value="windows"> Windows</label>
        <label><input type="checkbox" value="ide"> IDE (VSCode/JetBrains)</label>
        <label><input type="checkbox" value="react"> React / Next</label>
        <label><input type="checkbox" value="vue"> Vue / Nuxt</label>
        <label><input type="checkbox" value="env"> 环境变量 / 密钥</label>
      </div>
      <div class="actions">
        <button id="gen" type="button">生成</button>
        <button id="copy" class="secondary" type="button">复制</button>
        <button id="download" class="secondary" type="button">下载 .gitignore</button>
        <button id="clear" class="secondary" type="button">清空勾选</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="output">生成内容</label>
        <textarea id="output" spellcheck="false" readonly rows="16" placeholder="勾选技术栈后点击生成"></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../unix-permission/">Unix 权限计算</a>
      <a href="../hash-generator/">Hash 生成器</a>
      <a href="../text-counter/">文本统计</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="gitignore-generator"></script>
</body>
</html>
