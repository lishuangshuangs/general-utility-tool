<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本去重 - Utilora</title>
  <meta name="description" content="按行去除重复文本，支持忽略大小写与空白，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>文本去重</h1>
      <p class="hint">按行去重，可选忽略大小写、去除首尾空白、保留空行。适合清理列表与日志。内容只在浏览器内处理。</p>
      <textarea id="input" spellcheck="false" placeholder="每行一条，例如：&#10;apple&#10;Banana&#10;apple&#10;banana"></textarea>
      <div class="actions" style="align-items:center">
        <label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:600"><input type="checkbox" id="ignore-case"> 忽略大小写</label>
        <label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:600"><input type="checkbox" id="trim" checked> 去除首尾空白</label>
        <label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:600"><input type="checkbox" id="keep-empty"> 保留空行</label>
      </div>
      <div class="actions">
        <button id="run" type="button">去重</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><span>原行数</span><strong id="before">0</strong></div>
        <div class="stat"><span>去重后</span><strong id="after">0</strong></div>
        <div class="stat"><span>移除</span><strong id="removed">0</strong></div>
      </div>
      <textarea id="output" readonly spellcheck="false" placeholder="去重结果"></textarea>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-counter/">文本统计</a>
      <a href="../text-diff/">文本对比</a>
      <a href="../case-converter/">大小写转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="text-dedupe"></script>
</body>
</html>
