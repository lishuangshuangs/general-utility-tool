<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>罗马数字转换 - Utilora</title>
  <meta name="description" content="阿拉伯数字与罗马数字互转，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>罗马数字转换</h1>
      <p class="hint">将阿拉伯数字（1–3999）转换为罗马数字，或将罗马数字还原为阿拉伯数字。内容仅在浏览器内处理。</p>
      <div class="field">
        <label for="input">输入数字或罗马数字</label>
        <input id="input" type="text" placeholder="例如 2026 或 MMXXVI" autocomplete="off">
      </div>
      <div class="actions">
        <button id="to-roman" type="button">转为罗马数字</button>
        <button id="to-arabic" class="secondary" type="button">转为阿拉伯数字</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
      </div>
      <div class="stat" style="margin-top:16px">
        <span>结果</span>
        <code id="output" style="display:block;margin-top:6px;font-size:20px;word-break:break-all">—</code>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../number-base/">进制转换</a>
      <a href="../number-chinese/">数字转中文大写</a>
      <a href="../timestamp/">时间戳转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="roman-numeral"></script>
</body>
</html>
