<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unix 权限计算 - Utilora</title>
  <meta name="description" content="在浏览器中计算 Unix/Linux 文件权限，支持八进制、符号表示与 chmod 命令，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .perm-table{width:100%;border-collapse:collapse;margin:12px 0}
    .perm-table th,.perm-table td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
    .perm-table th{color:#475569;font-size:13px;font-weight:700}
    .perm-table label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
    .perm-table input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
    .perm-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
    .perm-out .stat{text-align:left}
    .perm-out code{display:block;margin-top:4px;font-size:15px;word-break:break-all}
    .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .presets button{font-size:13px}
    @media(max-width:650px){.perm-out{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>Unix 权限计算</h1>
      <p class="hint">勾选读（r）、写（w）、执行（x）权限，即时得到八进制、符号表示与 chmod 命令。内容仅在浏览器内处理。</p>
      <table class="perm-table">
        <thead>
          <tr><th></th><th>所有者 (u)</th><th>同组 (g)</th><th>其他人 (o)</th></tr>
        </thead>
        <tbody>
          <tr>
            <th>读 (4)</th>
            <td><label><input type="checkbox" data-bit="4" data-who="u" checked> r</label></td>
            <td><label><input type="checkbox" data-bit="4" data-who="g" checked> r</label></td>
            <td><label><input type="checkbox" data-bit="4" data-who="o" checked> r</label></td>
          </tr>
          <tr>
            <th>写 (2)</th>
            <td><label><input type="checkbox" data-bit="2" data-who="u" checked> w</label></td>
            <td><label><input type="checkbox" data-bit="2" data-who="g"> w</label></td>
            <td><label><input type="checkbox" data-bit="2" data-who="o"> w</label></td>
          </tr>
          <tr>
            <th>执行 (1)</th>
            <td><label><input type="checkbox" data-bit="1" data-who="u"> x</label></td>
            <td><label><input type="checkbox" data-bit="1" data-who="g"> x</label></td>
            <td><label><input type="checkbox" data-bit="1" data-who="o"> x</label></td>
          </tr>
        </tbody>
      </table>
      <div class="perm-out">
        <div class="stat"><span>八进制</span><code id="octal">644</code></div>
        <div class="stat"><span>符号表示</span><code id="symbolic">rw-r--r--</code></div>
        <div class="stat"><span>命令</span><code id="command">chmod 644 filename</code></div>
      </div>
      <div class="actions">
        <button id="copy-cmd" type="button">复制命令</button>
        <button id="copy-octal" class="secondary" type="button">复制八进制</button>
      </div>
      <p class="hint" style="margin-top:18px;margin-bottom:8px">常用预设</p>
      <div class="presets">
        <button type="button" class="secondary" data-perm="755">755 目录/可执行</button>
        <button type="button" class="secondary" data-perm="644">644 普通文件</button>
        <button type="button" class="secondary" data-perm="600">600 私有文件</button>
        <button type="button" class="secondary" data-perm="700">700 私有目录</button>
        <button type="button" class="secondary" data-perm="777">777 全开（慎用）</button>
        <button type="button" class="secondary" data-perm="444">444 只读</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../number-base/">进制转换</a>
      <a href="../cron-explainer/">Cron 表达式解释</a>
      <a href="../hash-generator/">Hash 生成器</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="unix-permission"></script>
</body>
</html>
