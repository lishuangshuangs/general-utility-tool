<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片水印 - Utilora</title>
  <meta name="description" content="在浏览器中为图片添加文字水印，可调位置、透明度与平铺。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .dropzone{display:grid;min-height:140px;place-items:center;padding:24px;color:#64748b;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;text-align:center;cursor:pointer}
    .dropzone.drag{border-color:#818cf8;background:#eef2ff;color:#4f46e5}
    .dropzone b{display:block;margin-bottom:6px;color:#111827;font-size:16px}
    .preview{margin-top:18px;overflow:hidden;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px}
    .preview img{display:block;width:100%;max-height:420px;object-fit:contain;background:#fff}
    #file{display:none}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>图片水印</h1>
      <p class="hint">添加文字水印。图片不会上传。</p>
      <label class="dropzone" id="dropzone" for="file">
        <span><b>拖入、点选或粘贴图片</b>单张最大 20 MB</span>
      </label>
      <input id="file" type="file" accept="image/*">
      <div class="grid" style="margin-top:16px">
        <div class="field" style="grid-column:1/-1">
          <label for="text">水印文字</label>
          <input id="text" type="text" value="Utilora" maxlength="80">
        </div>
        <div class="field">
          <label for="position">位置</label>
          <select id="position">
            <option value="br" selected>右下</option>
            <option value="bl">左下</option>
            <option value="tr">右上</option>
            <option value="tl">左上</option>
            <option value="center">居中</option>
            <option value="tile">平铺</option>
          </select>
        </div>
        <div class="field">
          <label for="size">字号 <span id="sizeText">32</span></label>
          <input id="size" type="range" min="12" max="120" step="2" value="32">
        </div>
        <div class="field">
          <label for="opacity">透明度 <span id="opacityText">0.35</span></label>
          <input id="opacity" type="range" min="0.1" max="0.9" step="0.05" value="0.35">
        </div>
        <div class="field">
          <label for="color">颜色</label>
          <input id="color" type="color" value="#ffffff">
        </div>
        <div class="field">
          <label for="angle">旋转 <span id="angleText">0°</span></label>
          <input id="angle" type="range" min="-45" max="45" step="1" value="-20">
        </div>
        <div class="field">
          <label for="format">导出</label>
          <select id="format">
            <option value="image/png" selected>PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="download" disabled>下载</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
      <div id="preview" class="preview" hidden>
        <img id="previewImg" alt="预览">
      </div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../image-compress/">图片压缩</a>
      <a href="../image-convert/">格式转换</a>
      <a href="../image-palette/">主色提取</a>
    </div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="image-watermark"></script>
</body>
</html>
