<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User-Agent 解析 - Utilora</title>
  <meta name="description" content="解析浏览器 User-Agent 字符串，识别系统、浏览器与设备类型，本地处理。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>User-Agent 解析</h1>
      <p class="hint">粘贴 User-Agent 字符串，解析出操作系统、浏览器与设备类型。也可直接读取当前浏览器 UA。全部在本地完成。</p>
      <div class="field">
        <label for="input">User-Agent 字符串</label>
        <textarea id="input" rows="3" placeholder="粘贴 UA，或点击「使用当前 UA」"></textarea>
      </div>
      <div class="actions">
        <button id="parse" type="button">解析</button>
        <button id="current" class="secondary" type="button">使用当前 UA</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div id="result" class="stats" style="margin-top:16px;display:none">
        <div class="stat"><strong id="os">—</strong>操作系统</div>
        <div class="stat"><strong id="browser">—</strong>浏览器</div>
        <div class="stat"><strong id="device">—</strong>设备</div>
        <div class="stat"><strong id="engine">—</strong>引擎</div>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../url-parser/">URL 解析器</a>
      <a href="../cookie-parser/">Cookie 解析</a>
      <a href="../jwt-decoder/">JWT 解码</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="user-agent"></script>
</body>
</html>
