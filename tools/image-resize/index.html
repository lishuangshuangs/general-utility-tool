<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片尺寸与裁剪 - Utilora</title>
  <meta name="description" content="在浏览器中调整图片宽高，或按比例裁剪后导出。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .dropzone{display:grid;min-height:140px;place-items:center;padding:24px;color:#64748b;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;text-align:center;cursor:pointer}
    .dropzone.drag{border-color:#818cf8;background:#eef2ff;color:#4f46e5}
    .dropzone b{display:block;margin-bottom:6px;color:#111827;font-size:16px}
    .stage{position:relative;margin-top:18px;overflow:auto;background:#0f172a0d;border:1px solid #e2e8f0;border-radius:14px}
    #stageCanvas{display:block;max-width:100%;margin:0 auto;cursor:crosshair;touch-action:none}
    #file{display:none}
    .meta{margin-top:10px;color:#64748b;font-size:13px}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>图片尺寸与裁剪</h1>
      <p class="hint">先缩放，再在画布上拖选裁剪区域。处理全程留在本机。</p>
      <label class="dropzone" id="dropzone" for="file">
        <span><b>拖入、点选或粘贴图片</b>单张最大 20 MB</span>
      </label>
      <input id="file" type="file" accept="image/*">
      <div class="grid" style="margin-top:16px">
        <div class="field">
          <label for="width">宽度</label>
          <input id="width" type="number" min="1" max="8000" placeholder="宽">
        </div>
        <div class="field">
          <label for="height">高度</label>
          <input id="height" type="number" min="1" max="8000" placeholder="高">
        </div>
        <div class="field">
          <label for="lock">比例</label>
          <select id="lock">
            <option value="1" selected>锁定原比例</option>
            <option value="0">自由宽高</option>
          </select>
        </div>
        <div class="field">
          <label for="ratio">裁剪比例</label>
          <select id="ratio">
            <option value="free" selected>自由框选</option>
            <option value="1:1">1:1</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
          </select>
        </div>
        <div class="field">
          <label for="format">导出格式</label>
          <select id="format">
            <option value="image/png" selected>PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="download" disabled>下载</button>
        <button id="resetCrop" class="secondary" disabled>重置裁剪</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
      <div id="stage" class="stage" hidden>
        <canvas id="stageCanvas"></canvas>
      </div>
      <p id="meta" class="meta"></p>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../image-compress/">图片压缩</a>
      <a href="../image-convert/">格式转换</a>
      <a href="../image-watermark/">图片水印</a>
    </div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="image-resize"></script>
</body>
</html>
