<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UTM 链接生成 - Utilora</title>
  <meta name="description" content="生成带 UTM 参数的营销跟踪链接，本地拼装，不上传数据。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>UTM 链接生成</h1>
      <p class="hint">填写目标网址与 UTM 参数，生成带跟踪参数的完整链接。适合投放、邮件与内容渠道统计。仅在浏览器内拼装。</p>
      <div class="field">
        <label for="url">目标网址 *</label>
        <input id="url" type="url" placeholder="https://example.com/page" autocomplete="off">
      </div>
      <div class="grid">
        <div class="field">
          <label for="source">utm_source *</label>
          <input id="source" placeholder="例如 google / newsletter" list="src-list">
          <datalist id="src-list">
            <option value="google"></option>
            <option value="baidu"></option>
            <option value="wechat"></option>
            <option value="weibo"></option>
            <option value="newsletter"></option>
            <option value="email"></option>
            <option value="twitter"></option>
            <option value="linkedin"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="medium">utm_medium</label>
          <input id="medium" placeholder="例如 cpc / social / email" list="med-list">
          <datalist id="med-list">
            <option value="cpc"></option>
            <option value="organic"></option>
            <option value="social"></option>
            <option value="email"></option>
            <option value="referral"></option>
            <option value="banner"></option>
          </datalist>
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label for="campaign">utm_campaign</label>
          <input id="campaign" placeholder="例如 spring_sale">
        </div>
        <div class="field">
          <label for="term">utm_term</label>
          <input id="term" placeholder="关键词（可选）">
        </div>
      </div>
      <div class="field">
        <label for="content">utm_content</label>
        <input id="content" placeholder="区分素材或位置（可选）">
      </div>
      <div class="actions">
        <button id="build" type="button">生成链接</button>
        <button id="copy" class="secondary" type="button">复制链接</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="output">生成结果</label>
        <textarea id="output" readonly rows="3" placeholder="生成后显示完整 UTM 链接"></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../url-parser/">URL 解析器</a>
      <a href="../url-codec/">URL 编解码</a>
      <a href="../qr-code/">二维码</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="utm-builder"></script>
</body>
</html>
