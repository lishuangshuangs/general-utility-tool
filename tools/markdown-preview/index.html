<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Markdown 预览 - Utilora</title>
  <meta name="description" content="本地预览 Markdown，并复制可粘贴到微信公众号的 HTML。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head"><nav><a class="brand" href="../../">Utilora</a><a href="../../feedback/">功能建议</a></nav></header>
  <main class="tool-main">
    <div class="panel">
      <h1>Markdown 预览</h1>
      <p class="hint">本地预览笔记。公众号样式带内联颜色与字号，可直接贴进微信编辑器。</p>
      <div class="split">
        <textarea id="source" class="mono" spellcheck="false"></textarea>
        <article id="preview" class="markdown-preview"></article>
      </div>
      <div class="actions">
        <button id="sample" class="secondary">示例</button>
        <button id="copy-html" class="secondary">复制 HTML</button>
        <button id="copy-wechat">复制公众号</button>
        <button id="share" class="secondary">复制链接</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message">公众号样式带内联颜色与字号，粘贴到微信编辑器即可。</div>
    </div>
    <div class="related"><span>相关工具</span><a href="../html-entities/">HTML 实体</a><a href="../zh-convert/">简繁拼音</a><a href="../text-counter/">文本统计</a></div>
  </main>
  <script src="../../assets/js/share.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="markdown-preview"></script>
</body>
</html>
