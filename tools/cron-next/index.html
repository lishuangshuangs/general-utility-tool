<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cron 下次运行 - Utilora</title>
  <meta name="description" content="输入 5 段 Cron 表达式，本地计算接下来若干次运行时间，不上传任何内容。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .next-list{list-style:none;padding:0;margin:16px 0 0}
    .next-list li{padding:12px 14px;background:#f8fafc;border-radius:10px;margin-bottom:8px;font-family:ui-monospace,monospace;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .next-list li span{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>Cron 下次运行</h1>
      <p class="hint">输入标准 5 段 Cron 表达式（分 时 日 月 星期），计算从现在起接下来几次运行时间。计算在本地完成。</p>
      <div class="field">
        <label for="cron">Cron 表达式</label>
        <input id="cron" type="text" value="0 9 * * 1-5" placeholder="例如 0 9 * * 1-5">
      </div>
      <div class="field">
        <label for="count">显示次数</label>
        <input id="count" type="number" min="1" max="20" value="5">
      </div>
      <div class="actions">
        <button id="run" type="button">计算下次运行</button>
        <button id="sample" class="secondary" type="button">示例：工作日 9 点</button>
      </div>
      <ul class="next-list" id="list"></ul>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../cron-explainer/">Cron 表达式解释</a>
      <a href="../timestamp/">时间戳转换</a>
      <a href="../unix-permission/">Unix 权限计算</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="cron-next"></script>
</body>
</html>
