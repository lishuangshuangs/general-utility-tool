<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cron 下次运行 - Utilora</title>
  <meta name="description" content="计算 Cron 表达式接下来若干次运行时间，本地处理。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a>
      <a href="../../">返回首页</a>
    </nav>
  </header>
  <main class="tool-main">
    <section class="panel">
      <h1>Cron 下次运行时间</h1>
      <p class="hint">输入 5 段 Cron 表达式，计算从现在起接下来若干次触发时间。支持常见语法，全部在浏览器本地完成。</p>
      <div class="field">
        <label for="expr">Cron 表达式（分 时 日 月 周）</label>
        <input id="expr" type="text" placeholder="例如：0 9 * * 1-5" value="0 9 * * 1-5">
      </div>
      <div class="field">
        <label for="count">显示次数（1–20）</label>
        <input id="count" type="number" min="1" max="20" value="5">
      </div>
      <div class="actions">
        <button id="calc" type="button">计算</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div id="output" class="output" style="margin-top:16px;padding:14px;background:#f8fafc;border-radius:10px;min-height:80px;font-family:ui-monospace,monospace;font-size:14px;line-height:1.8">—</div>
      <div id="message" class="message"></div>
    </section>
    <div class="related">
      <span>相关工具</span>
      <a href="../cron-explainer/">Cron 表达式解释</a>
      <a href="../timestamp/">时间戳转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="cron-next"></script>
</body>
</html>
