<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>色彩对比度 - Utilora</title>
  <meta name="description" content="本地计算前景与背景色的 WCAG 对比度，判断 AA/AAA 通过情况，支持色盲友好检查。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .swatch-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
    .swatch{height:72px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
    .ratio-box{text-align:center;padding:18px;background:#f8fafc;border-radius:12px;margin:16px 0}
    .ratio-box strong{display:block;font-size:36px;color:var(--primary);font-variant-numeric:tabular-nums}
    .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
    .badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
    .badge.pass{background:#ecfdf5;color:#047857}
    .badge.fail{background:#fef2f2;color:#b91c1c}
    .color-inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .color-inputs input[type=color]{width:100%;height:42px;padding:2px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
    @media(max-width:500px){.swatch-row,.color-inputs{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>色彩对比度</h1>
      <p class="hint">选择或输入前景色与背景色，即时计算 WCAG 对比度比值，并判断正文与大字号在 AA、AAA 级别是否通过。全部计算在浏览器内完成。</p>
      <div class="color-inputs">
        <div class="field">
          <label for="fg">前景色（文字）</label>
          <input id="fg" type="color" value="#111827">
          <input id="fgHex" type="text" value="#111827" style="margin-top:8px" placeholder="#111827">
        </div>
        <div class="field">
          <label for="bg">背景色</label>
          <input id="bg" type="color" value="#ffffff">
          <input id="bgHex" type="text" value="#ffffff" style="margin-top:8px" placeholder="#ffffff">
        </div>
      </div>
      <div class="swatch-row">
        <div class="swatch" id="swatchNormal">正文示例 Aa 12pt</div>
        <div class="swatch" id="swatchLarge" style="font-size:18px">大字示例 Aa 18pt</div>
      </div>
      <div class="ratio-box">
        <span>对比度比值</span>
        <strong id="ratio">—</strong>
        <div class="badges" id="badges"></div>
      </div>
      <div class="actions">
        <button id="swap" class="secondary" type="button">交换前景/背景</button>
        <button id="sample" class="secondary" type="button">示例：深色正文</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../color-converter/">颜色转换</a>
      <a href="../random-palette/">随机色板</a>
      <a href="../css-units/">CSS 单位转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="color-contrast"></script>
</body>
</html>
