<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPv4 / CIDR 计算 - Utilora</title>
  <meta name="description" content="在浏览器中计算 IPv4 子网、CIDR 网段、可用主机与广播地址，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
    .result-grid .stat{text-align:left}
    .result-grid code{display:block;margin-top:4px;font-size:14px;word-break:break-all}
    @media(max-width:650px){.result-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>IPv4 / CIDR 计算</h1>
      <p class="hint">输入 IP 与前缀长度（如 192.168.1.0/24），即时计算网络地址、广播、掩码与可用主机范围。全部在本地完成。</p>
      <div class="field">
        <label for="cidr">IP 或 CIDR</label>
        <input id="cidr" type="text" placeholder="例如 192.168.1.10/24 或 10.0.0.0/8" value="192.168.1.0/24">
      </div>
      <div class="actions">
        <button id="calc" type="button">计算</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
      </div>
      <div id="result" class="result-grid" hidden>
        <div class="stat"><span>网络地址</span><code id="network">—</code></div>
        <div class="stat"><span>广播地址</span><code id="broadcast">—</code></div>
        <div class="stat"><span>子网掩码</span><code id="mask">—</code></div>
        <div class="stat"><span>通配掩码</span><code id="wildcard">—</code></div>
        <div class="stat"><span>前缀</span><code id="prefix">—</code></div>
        <div class="stat"><span>主机数</span><code id="hosts">—</code></div>
        <div class="stat"><span>可用主机起</span><code id="first">—</code></div>
        <div class="stat"><span>可用主机止</span><code id="last">—</code></div>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../number-base/">进制转换</a>
      <a href="../url-parser/">URL 解析器</a>
      <a href="../unix-permission/">Unix 权限计算</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="ipv4-cidr"></script>
</body>
</html>
