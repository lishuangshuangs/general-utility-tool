<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片主色提取 - Utilora</title>
  <meta name="description" content="从图片中提取主色调，复制 HEX、RGB 或 CSS 变量。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .dropzone{display:grid;min-height:140px;place-items:center;padding:24px;color:#64748b;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;text-align:center;cursor:pointer}
    .dropzone.drag{border-color:#818cf8;background:#eef2ff;color:#4f46e5}
    .dropzone b{display:block;margin-bottom:6px;color:#111827;font-size:16px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px}
    .preview{overflow:hidden;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px}
    .preview img{display:block;width:100%;max-height:360px;object-fit:contain;background:#fff}
    .swatches{display:grid;gap:10px}
    .swatch{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer}
    .swatch i{width:44px;height:44px;border-radius:10px;border:1px solid #00000014;flex:none}
    .swatch b{display:block;font-size:14px}
    .swatch span{color:#64748b;font-size:12px}
    #file{display:none}
    @media(max-width:700px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>图片主色提取</h1>
      <p class="hint">从照片里取出一组主色。点击色块即可复制。处理只在本地完成。</p>
      <label class="dropzone" id="dropzone" for="file">
        <span><b>拖入、点选或粘贴图片</b>单张最大 20 MB</span>
      </label>
      <input id="file" type="file" accept="image/*">
      <div class="grid" style="margin-top:16px">
        <div class="field">
          <label for="count">颜色数量</label>
          <select id="count">
            <option value="5" selected>5</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="copyCss" disabled>复制 CSS 变量</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
      <div id="layout" class="layout" hidden>
        <div class="preview"><img id="previewImg" alt="原图"></div>
        <div id="swatches" class="swatches"></div>
      </div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../color-converter/">颜色转换</a>
      <a href="../random-palette/">随机色板</a>
      <a href="../color-contrast/">色彩对比度</a>
    </div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="image-palette"></script>
</body>
</html>
