<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>百分比计算器 - Utilora</title>
  <meta name="description" content="计算百分比、占比与增减幅度，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:650px){.calc-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>百分比计算器</h1>
      <p class="hint">快速计算「X 的 Y%」「A 占 B 的百分比」「从 A 到 B 的增减幅度」。内容仅在浏览器内处理。</p>

      <h3 style="margin:0 0 12px;font-size:16px">X 的 Y% 是多少？</h3>
      <div class="calc-grid">
        <div class="field">
          <label for="p1-x">数值 X</label>
          <input id="p1-x" type="number" step="any" placeholder="例如 200">
        </div>
        <div class="field">
          <label for="p1-y">百分比 Y</label>
          <input id="p1-y" type="number" step="any" placeholder="例如 15">
        </div>
      </div>
      <div class="stat" style="margin-bottom:20px"><span>结果</span><strong id="p1-out">—</strong></div>

      <h3 style="margin:0 0 12px;font-size:16px">A 是 B 的百分之几？</h3>
      <div class="calc-grid">
        <div class="field">
          <label for="p2-a">数值 A</label>
          <input id="p2-a" type="number" step="any" placeholder="例如 45">
        </div>
        <div class="field">
          <label for="p2-b">数值 B</label>
          <input id="p2-b" type="number" step="any" placeholder="例如 150">
        </div>
      </div>
      <div class="stat" style="margin-bottom:20px"><span>结果</span><strong id="p2-out">—</strong></div>

      <h3 style="margin:0 0 12px;font-size:16px">从 A 到 B 的增减幅度</h3>
      <div class="calc-grid">
        <div class="field">
          <label for="p3-a">原值 A</label>
          <input id="p3-a" type="number" step="any" placeholder="例如 80">
        </div>
        <div class="field">
          <label for="p3-b">新值 B</label>
          <input id="p3-b" type="number" step="any" placeholder="例如 100">
        </div>
      </div>
      <div class="stat"><span>结果</span><strong id="p3-out">—</strong></div>

      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../unit-converter/">单位换算</a>
      <a href="../number-base/">进制转换</a>
      <a href="../random-number/">随机数生成器</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="percentage"></script>
</body>
</html>
