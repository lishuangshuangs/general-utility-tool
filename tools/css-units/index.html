<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSS 单位转换 - Utilora</title>
  <meta name="description" content="在浏览器中转换 px、rem、em、vw、vh 等 CSS 单位，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .unit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:8px}
    .unit-grid .field{margin:0}
    @media(max-width:650px){.unit-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>CSS 单位转换</h1>
      <p class="hint">输入任一单位数值，即时换算为 px、rem、em、vw、vh。可自定义根字号与视口尺寸。全部在本地计算。</p>
      <div class="grid" style="margin-bottom:14px">
        <div class="field">
          <label for="root">根字号 (html font-size, px)</label>
          <input id="root" type="number" value="16" min="1" step="1">
        </div>
        <div class="field">
          <label for="parent">父级字号 (em 基准, px)</label>
          <input id="parent" type="number" value="16" min="1" step="1">
        </div>
        <div class="field">
          <label for="vwBase">视口宽度 (vw 基准, px)</label>
          <input id="vwBase" type="number" value="1280" min="1" step="1">
        </div>
        <div class="field">
          <label for="vhBase">视口高度 (vh 基准, px)</label>
          <input id="vhBase" type="number" value="720" min="1" step="1">
        </div>
      </div>
      <div class="unit-grid">
        <div class="field">
          <label for="px">px</label>
          <input id="px" type="number" step="any" placeholder="0">
        </div>
        <div class="field">
          <label for="rem">rem</label>
          <input id="rem" type="number" step="any" placeholder="0">
        </div>
        <div class="field">
          <label for="em">em</label>
          <input id="em" type="number" step="any" placeholder="0">
        </div>
        <div class="field">
          <label for="vw">vw</label>
          <input id="vw" type="number" step="any" placeholder="0">
        </div>
        <div class="field">
          <label for="vh">vh</label>
          <input id="vh" type="number" step="any" placeholder="0">
        </div>
        <div class="field">
          <label for="percent">% (相对父级字号)</label>
          <input id="percent" type="number" step="any" placeholder="0">
        </div>
      </div>
      <div class="actions">
        <button id="sample" class="secondary" type="button">示例 16px</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../unit-converter/">单位换算</a>
      <a href="../color-converter/">颜色转换</a>
      <a href="../number-base/">进制转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="css-units"></script>
</body>
</html>
