<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本二进制转换 - Utilora</title>
  <meta name="description" content="文本与二进制、十六进制互转，支持 UTF-8，本地处理。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a>
      <a href="../../">返回首页</a>
    </nav>
  </header>
  <main class="tool-main">
    <section class="panel">
      <h1>文本与二进制转换</h1>
      <p class="hint">将文本转为二进制或十六进制表示，或反向解码。支持 UTF-8 中文，全部在浏览器本地完成。</p>
      <div class="field">
        <label for="source">输入</label>
        <textarea id="source" placeholder="输入文本或二进制/十六进制字符串……"></textarea>
      </div>
      <div class="field">
        <label for="format">目标格式</label>
        <select id="format">
          <option value="bin">二进制 (空格分隔)</option>
          <option value="hex">十六进制</option>
          <option value="text">文本 (从二进制/十六进制解码)</option>
        </select>
      </div>
      <div class="actions">
        <button id="convert" type="button">转换</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="field">
        <label for="result">结果</label>
        <textarea id="result" readonly placeholder="转换结果将显示在此"></textarea>
      </div>
      <div id="message" class="message"></div>
    </section>
    <div class="related">
      <span>相关工具</span>
      <a href="../base64/">Base64 编解码</a>
      <a href="../number-base/">进制转换</a>
      <a href="../hash-generator/">Hash 生成器</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="text-binary"></script>
</body>
</html>
