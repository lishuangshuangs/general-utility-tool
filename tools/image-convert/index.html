<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片格式转换 - Utilora</title>
  <meta name="description" content="在浏览器中把图片转为 JPEG、PNG 或 WebP，支持批量与打包下载。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .dropzone{display:grid;min-height:160px;place-items:center;padding:28px;color:#64748b;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;text-align:center;cursor:pointer}
    .dropzone.drag{border-color:#818cf8;background:#eef2ff;color:#4f46e5}
    .dropzone b{display:block;margin-bottom:6px;color:#111827;font-size:16px}
    .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
    .preview-card{overflow:hidden;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px}
    .preview-card img{display:block;width:100%;max-height:280px;object-fit:contain;background:#fff}
    .preview-card p{margin:0;padding:10px 12px;color:#64748b;font-size:13px}
    .batch-list{margin-top:18px;padding:0;list-style:none;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
    .batch-list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid #e2e8f0;font-size:14px}
    .batch-list li:first-child{border-top:0}
    .batch-list img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#fff}
    .batch-list span:last-child{margin-left:auto;color:#64748b;font-size:12px}
    #file{display:none}
    @media(max-width:650px){.preview-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>图片格式转换</h1>
      <p class="hint">JPEG、PNG、WebP 互转。图片只在浏览器里处理，最多 20 张。</p>
      <label class="dropzone" id="dropzone" for="file">
        <span><b>拖入、点选或粘贴图片</b>支持 JPG、PNG、WebP、GIF，单张最大 20 MB</span>
      </label>
      <input id="file" type="file" accept="image/*" multiple>
      <div class="grid" style="margin-top:16px">
        <div class="field">
          <label for="format">目标格式</label>
          <select id="format">
            <option value="image/webp">WebP</option>
            <option value="image/jpeg" selected>JPEG</option>
            <option value="image/png">PNG</option>
          </select>
        </div>
        <div class="field">
          <label for="quality">画质 <span id="qualityText">0.90</span></label>
          <input id="quality" type="range" min="0.4" max="1" step="0.05" value="0.9">
        </div>
        <div class="field">
          <label for="bg">JPEG 背景</label>
          <input id="bg" type="color" value="#ffffff">
        </div>
      </div>
      <div class="actions">
        <button id="download" disabled>下载</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
      <div id="compare" class="preview-grid" hidden>
        <div class="preview-card"><img id="beforeImg" alt="原图"><p>原图 <strong id="beforeMeta">—</strong></p></div>
        <div class="preview-card"><img id="afterImg" alt="转换后"><p>转换后 <strong id="afterMeta">—</strong></p></div>
      </div>
      <ul id="batch" class="batch-list" hidden></ul>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../image-compress/">图片压缩</a>
      <a href="../image-resize/">尺寸与裁剪</a>
      <a href="../image-watermark/">图片水印</a>
    </div>
  </main>
  <script src="../../assets/js/zip.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="image-convert"></script>
</body>
</html>
