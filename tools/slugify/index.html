<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本转 Slug - Utilora</title>
  <meta name="description" content="将中英文文本转换为 URL 友好的 slug，支持拼音首字母与去重，本地处理。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a>
      <a href="../../">返回首页</a>
    </nav>
  </header>
  <main class="tool-main">
    <section class="panel">
      <h1>文本转 URL Slug</h1>
      <p class="hint">将标题或短语转为 URL 安全的 slug。支持中文转拼音首字母、小写、连字符分隔，全部在浏览器本地完成。</p>
      <div class="field">
        <label for="source">原始文本</label>
        <textarea id="source" placeholder="例如：你好世界 Hello World 2026"></textarea>
      </div>
      <div class="grid">
        <div class="field">
          <label for="mode">中文处理</label>
          <select id="mode">
            <option value="pinyin">拼音首字母</option>
            <option value="remove">直接移除中文</option>
            <option value="keep">保留汉字</option>
          </select>
        </div>
        <div class="field">
          <label for="sep">分隔符</label>
          <select id="sep">
            <option value="-">连字符 -</option>
            <option value="_">下划线 _</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="convert" type="button">转换</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="field">
        <label for="result">Slug 结果</label>
        <textarea id="result" readonly placeholder="转换结果将显示在此"></textarea>
      </div>
      <div id="message" class="message"></div>
    </section>
    <div class="related">
      <span>相关工具</span>
      <a href="../zh-convert/">简繁拼音</a>
      <a href="../url-codec/">URL 编解码</a>
      <a href="../case-converter/">大小写转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="slugify"></script>
</body>
</html>
