<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>随机色板生成 - Utilora</title>
  <meta name="description" content="生成和谐随机色板，支持多种风格，本地处理。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-top:16px}
    .swatch{border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.15s}
    .swatch:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0f172a15}
    .swatch .color{height:72px}
    .swatch .meta{padding:8px 10px;font-size:12px;font-family:ui-monospace,monospace;background:#f8fafc}
    .swatch .meta span{display:block;color:var(--muted);margin-top:2px}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a>
      <a href="../../">返回首页</a>
    </nav>
  </header>
  <main class="tool-main">
    <section class="panel">
      <h1>随机色板生成</h1>
      <p class="hint">一键生成和谐配色方案，适用于 UI 原型与设计灵感。颜色仅在浏览器内生成。</p>
      <div class="grid">
        <div class="field">
          <label for="count">颜色数量（3–12）</label>
          <input id="count" type="number" min="3" max="12" value="5">
        </div>
        <div class="field">
          <label for="style">风格</label>
          <select id="style">
            <option value="vibrant">鲜艳</option>
            <option value="pastel">柔和</option>
            <option value="earth">大地色</option>
            <option value="mono">单色系</option>
            <option value="random">完全随机</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="generate" type="button">生成色板</button>
        <button id="copy" class="secondary" type="button">复制全部 HEX</button>
      </div>
      <div id="swatches" class="swatches"></div>
      <div id="message" class="message"></div>
    </section>
    <div class="related">
      <span>相关工具</span>
      <a href="../color-converter/">颜色转换</a>
      <a href="../qr-code/">二维码</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="random-palette"></script>
</body>
</html>
