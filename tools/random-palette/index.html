<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>随机色板 - Utilora</title>
  <meta name="description" content="在浏览器内生成和谐随机色板，支持复制 HEX、RGB，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:16px 0}
    .swatch-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
    .swatch-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0f172a12}
    .swatch-card .chip{height:80px}
    .swatch-card .meta{padding:10px;font-size:13px;font-family:ui-monospace,monospace;text-align:center}
    .opts{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:8px}
    .opts .field{margin:0;min-width:100px}
    @media(max-width:500px){.palette{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>随机色板</h1>
      <p class="hint">一键生成若干随机颜色，点击色块即可复制 HEX。可调整数量与明度范围，全部在本地完成。</p>
      <div class="opts">
        <div class="field">
          <label for="count">数量</label>
          <input id="count" type="number" min="3" max="12" value="5">
        </div>
        <div class="field">
          <label for="mode">风格</label>
          <select id="mode">
            <option value="vibrant">鲜明</option>
            <option value="pastel">柔和</option>
            <option value="dark">深色</option>
            <option value="any">任意</option>
          </select>
        </div>
        <button id="gen" type="button">重新生成</button>
        <button id="copyAll" class="secondary" type="button">复制全部 HEX</button>
      </div>
      <div class="palette" id="palette"></div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../color-converter/">颜色转换</a>
      <a href="../color-contrast/">色彩对比度</a>
      <a href="../css-units/">CSS 单位转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="random-palette"></script>
</body>
</html>
