<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>邮箱提取 - Utilora</title>
  <meta name="description" content="从文本中识别并提取邮箱地址，去重后复制，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>邮箱提取</h1>
      <p class="hint">粘贴任意文本，自动识别其中的邮箱地址并去重。适合从名单、邮件正文或日志中快速抽取联系人。仅在浏览器内处理。</p>
      <div class="field">
        <label for="input">输入文本</label>
        <textarea id="input" placeholder="粘贴含有邮箱的文本……"></textarea>
      </div>
      <div class="actions">
        <button id="run" type="button">提取</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
        <button id="sample" class="secondary" type="button">示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="stats" style="margin-top:16px">
        <div class="stat"><strong id="count">0</strong>个邮箱</div>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="output">提取结果（每行一个）</label>
        <textarea id="output" readonly placeholder="提取结果将显示在这里"></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-counter/">文本统计</a>
      <a href="../regex-tester/">正则测试</a>
      <a href="../text-diff/">文本对比</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="email-extractor"></script>
</body>
</html>
