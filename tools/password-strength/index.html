<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>密码强度分析 - Utilora</title>
  <meta name="description" content="本地分析密码长度、字符集、熵值与常见弱点，不上传任何内容。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .strength-bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0 6px}
    .strength-bar > i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s,background .25s}
    .score-label{font-weight:800;font-size:15px}
    .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .check{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f8fafc;border-radius:10px;font-size:13px}
    .check.ok{color:#047857;background:#ecfdf5}
    .check.bad{color:#b91c1c;background:#fef2f2}
    .check span{font-weight:700}
    @media(max-width:500px){.checks{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>密码强度分析</h1>
      <p class="hint">输入密码后即时评估长度、字符种类、估算熵值与常见弱点。分析仅在浏览器内完成，不会上传。</p>
      <div class="field">
        <label for="pwd">密码</label>
        <input id="pwd" type="password" placeholder="在此输入要评估的密码" autocomplete="off">
      </div>
      <div class="actions">
        <button id="toggle" class="secondary" type="button">显示密码</button>
        <button id="sample" class="secondary" type="button">示例弱密码</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div class="strength-bar"><i id="bar"></i></div>
      <div class="score-label" id="scoreLabel">请输入密码</div>
      <div class="stats" style="margin-top:16px">
        <div class="stat"><strong id="len">0</strong>长度</div>
        <div class="stat"><strong id="entropy">0</strong>估算熵(bit)</div>
        <div class="stat"><strong id="charset">—</strong>字符集</div>
        <div class="stat"><strong id="crack">—</strong>暴力估算</div>
      </div>
      <div class="checks" id="checks"></div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../password-generator/">密码生成器</a>
      <a href="../hash-generator/">Hash 生成器</a>
      <a href="../uuid-generator/">UUID 生成器</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="password-strength"></script>
</body>
</html>
