<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文本统计 - Utilora</title>
  <meta name="description" content="实时统计字符、中文、词数、字节和阅读时间，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>文本统计</h1>
      <p class="hint">实时统计字符、中文、词数、UTF-8 字节和阅读时间。适合检查文案、字幕和投稿字数。</p>
      <textarea id="input" placeholder="请输入或粘贴文本……"></textarea>
      <div class="actions">
        <button id="copy">复制文本</button>
        <button id="sample" class="secondary">示例</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div class="stats stats-wide">
        <div class="stat"><strong id="chars">0</strong>字符</div>
        <div class="stat"><strong id="nonspaces">0</strong>非空字符</div>
        <div class="stat"><strong id="cjk">0</strong>中文</div>
        <div class="stat"><strong id="words">0</strong>字数/单词</div>
        <div class="stat"><strong id="lines">0</strong>行</div>
        <div class="stat"><strong id="bytes">0 B</strong>UTF-8</div>
        <div class="stat"><strong id="readtime">—</strong>阅读时间</div>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-diff/">文本对比</a>
      <a href="../case-converter/">大小写转换</a>
      <a href="../html-entities/">HTML 实体</a>
    </div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="text-counter"></script>
</body>
</html>
