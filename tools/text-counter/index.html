<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本统计 - Utilora</title><link rel="stylesheet" href="../../assets/css/site.css"></head><body><header class="tool-head"><nav><a class="brand" href="../../">Utilora</a><a href="../../feedback/">功能建议</a></nav></header><main class="tool-main"><div class="panel"><h1>文本统计</h1><p class="hint">实时统计字符、非空字符、字数和行数。</p><textarea id="input" placeholder="请输入或粘贴文本……"></textarea><div class="actions"><button id="copy">复制文本</button><button id="clear" class="secondary">清空</button></div><div class="stats"><div class="stat"><strong id="chars">0</strong>字符</div><div class="stat"><strong id="nonspaces">0</strong>非空字符</div><div class="stat"><strong id="words">0</strong>字数/单词</div><div class="stat"><strong id="lines">0</strong>行</div></div><div id="message" class="message"></div></div></main><script src="tool.js"></script><script src="../../assets/js/analytics.js" data-tool="text-counter"></script></body></html>
