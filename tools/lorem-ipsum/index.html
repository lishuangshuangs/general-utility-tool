<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>占位文本生成器 - Utilora</title>
  <meta name="description" content="在浏览器中生成 Lorem Ipsum 与中文占位文本，支持段落、句子、字数控制，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>占位文本生成器</h1>
      <p class="hint">生成英文 Lorem Ipsum 或中文占位段落，用于设计稿与原型填充。内容仅在浏览器内生成。</p>
      <div class="grid">
        <div class="field">
          <label for="lang">语言</label>
          <select id="lang">
            <option value="zh">中文</option>
            <option value="en">英文 Lorem</option>
          </select>
        </div>
        <div class="field">
          <label for="type">类型</label>
          <select id="type">
            <option value="paragraphs">段落</option>
            <option value="sentences">句子</option>
            <option value="words">词语</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="count">数量：<span id="countText">3</span></label>
        <input id="count" type="range" min="1" max="20" value="3">
      </div>
      <textarea id="output" readonly spellcheck="false" placeholder="点击生成…"></textarea>
      <div class="actions">
        <button id="generate" type="button">生成</button>
        <button id="copy" class="secondary" type="button">复制</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-counter/">文本统计</a>
      <a href="../markdown-preview/">Markdown 预览</a>
      <a href="../case-converter/">大小写转换</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="lorem-ipsum"></script>
</body>
</html>
