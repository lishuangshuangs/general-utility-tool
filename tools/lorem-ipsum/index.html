<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>占位文本生成 - Utilora</title>
  <meta name="description" content="在浏览器中生成 Lorem Ipsum 与中文占位文本，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>占位文本生成</h1>
      <p class="hint">生成 Lorem Ipsum 或中文占位段落，用于原型与排版预览。内容仅在浏览器内生成。</p>
      <div class="grid">
        <div class="field">
          <label for="lang">语言</label>
          <select id="lang">
            <option value="latin">Lorem Ipsum（拉丁）</option>
            <option value="zh">中文占位</option>
          </select>
        </div>
        <div class="field">
          <label for="count">段落数（1–20）</label>
          <input id="count" type="number" min="1" max="20" value="3">
        </div>
      </div>
      <div class="actions">
        <button id="generate" type="button">生成</button>
        <button id="copy" class="secondary" type="button">复制</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <textarea id="output" readonly spellcheck="false" placeholder="点击生成后显示占位文本"></textarea>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-counter/">文本统计</a>
      <a href="../markdown-preview/">Markdown 预览</a>
      <a href="../text-dedupe/">文本去重</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="lorem-ipsum"></script>
</body>
</html>
