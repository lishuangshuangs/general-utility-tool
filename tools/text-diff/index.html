<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本对比 - Utilora</title><link rel="stylesheet" href="../../assets/css/site.css"><style>.diff-line{display:block;padding:4px 8px}.add{color:#047857;background:#ecfdf5}.remove{color:#b91c1c;background:#fef2f2}.same{color:#64748b}.diff-prefix{display:inline-block;width:22px;font-weight:bold}</style></head><body><header class="tool-head"><nav><a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a><a href="../../">返回首页</a></nav></header><main class="tool-main"><section class="panel"><h1>文本对比</h1><p class="hint">按行比较两段文本。绿色表示新增，红色表示删除。</p><div class="split"><div><label for="before">原文本</label><textarea id="before"></textarea></div><div><label for="after">新文本</label><textarea id="after"></textarea></div></div><div class="actions"><button id="compare">开始对比</button><button id="swap" class="secondary">交换文本</button><button id="clear" class="secondary">清空</button></div><div id="summary" class="message"></div><div id="diff" class="result output">等待对比</div></section></main><script src="tool.js"></script><script src="../../assets/js/analytics.js" data-tool="text-diff"></script></body></html>
