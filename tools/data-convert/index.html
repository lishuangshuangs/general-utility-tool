<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON / YAML / CSV - Utilora</title>
  <meta name="description" content="在浏览器里把 JSON、YAML、CSV 互相转换，不上传内容。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head"><nav><a class="brand" href="../../">Utilora</a><a href="../../feedback/">功能建议</a></nav></header>
  <main class="tool-main">
    <div class="panel">
      <h1>JSON / YAML / CSV</h1>
      <p class="hint">三种格式在本地互转。CSV 第一行作为表头。</p>
      <div class="grid">
        <div class="field"><label for="from">从</label>
          <select id="from"><option value="json">JSON</option><option value="yaml">YAML</option><option value="csv">CSV</option></select>
        </div>
        <div class="field"><label for="to">到</label>
          <select id="to"><option value="yaml">YAML</option><option value="json">JSON</option><option value="csv">CSV</option></select>
        </div>
      </div>
      <div class="split">
        <textarea id="source" class="mono" spellcheck="false"></textarea>
        <textarea id="result" class="mono" readonly></textarea>
      </div>
      <div class="actions">
        <button id="swap" class="secondary">互换</button>
        <button id="copy" class="secondary">复制结果</button>
        <button id="share" class="secondary">复制链接</button>
      </div>
      <div id="message" class="message">转换在本地完成，CSV 第一行作为表头。</div>
    </div>
    <div class="related"><span>相关工具</span><a href="../json-formatter/">JSON 格式化</a><a href="../text-diff/">文本对比</a><a href="../base64/">Base64 编解码</a></div>
  </main>
  <script src="../../assets/vendor/js-yaml.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js'"></script>
  <script src="../../assets/js/csv.js"></script>
  <script src="../../assets/js/share.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="data-convert"></script>
</body>
</html>
