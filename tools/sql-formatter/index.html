<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SQL 格式化 - Utilora</title>
  <meta name="description" content="在浏览器中格式化、压缩 SQL 语句，关键字大写与缩进，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>SQL 格式化</h1>
      <p class="hint">格式化常见 SQL 语句：关键字大写、合理换行与缩进。内容只在你的浏览器里处理。按 <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 快速格式化。</p>
      <textarea id="input" spellcheck="false" placeholder="SELECT id, name FROM users WHERE status = 1;"></textarea>
      <div class="actions">
        <button id="format">格式化</button>
        <button id="minify" class="secondary">压缩</button>
        <button id="upper" class="secondary">关键字大写</button>
        <button id="sample" class="secondary">示例</button>
        <button id="copy" class="secondary">复制</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../json-formatter/">JSON 格式化</a>
      <a href="../data-convert/">JSON / YAML / CSV</a>
      <a href="../regex-tester/">正则测试</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="sql-formatter"></script>
</body>
</html>
