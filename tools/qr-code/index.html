<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>二维码 - Utilora</title>
  <meta name="description" content="在浏览器中生成或识别二维码，不上传内容。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .tabs{display:flex;gap:6px;margin-bottom:16px;padding:5px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px}
    .tabs button{flex:1;color:#64748b;background:transparent}
    .tabs button.active{color:#fff;background:#111827}
    #qr{display:grid;min-height:280px;margin-top:18px;place-items:center;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;overflow:auto}
    #qr canvas{max-width:100%;height:auto}
    .dropzone{display:grid;min-height:140px;place-items:center;padding:24px;color:#64748b;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;text-align:center;cursor:pointer}
    .decoded{margin-top:16px;padding:14px;background:#f8fafc;border-radius:12px;word-break:break-all}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <section class="panel">
      <h1>二维码</h1>
      <p class="hint">生成二维码，也可识别图片里的码。内容与图片仅在浏览器中处理。</p>
      <div class="tabs">
        <button type="button" id="tab-make" class="active">生成</button>
        <button type="button" id="tab-read">识别</button>
      </div>
      <div id="make-pane">
        <div class="field"><label for="content">文本或网址</label><textarea id="content" placeholder="https://utilora.github.io/"></textarea></div>
        <div class="grid">
          <div class="field"><label for="size">尺寸</label><select id="size"><option>192</option><option selected>256</option><option>320</option><option>384</option></select></div>
          <div class="field"><label for="level">容错</label><select id="level"><option value="L">L</option><option value="M" selected>M</option><option value="Q">Q</option><option value="H">H</option></select></div>
          <div class="field"><label for="border-style">边框</label><select id="border-style"><option value="none">无</option><option value="square" selected>浅色</option><option value="rounded">圆角</option><option value="dark">深色</option></select></div>
          <div class="field"><label for="icon">中心图标（可选）</label><input id="icon" type="file" accept="image/*"></div>
        </div>
        <div class="actions">
          <button id="generate">生成</button>
          <button id="download" class="secondary">下载 PNG</button>
          <button id="share" class="secondary">复制链接</button>
        </div>
        <div id="qr">等待输入内容</div>
      </div>
      <div id="read-pane" hidden>
        <label class="dropzone" id="read-drop" for="read-file">拖入、粘贴或选择含二维码的图片</label>
        <input id="read-file" type="file" accept="image/*">
        <div id="decoded" class="decoded" hidden></div>
        <div class="actions">
          <button id="copy-decoded" class="secondary" disabled>复制结果</button>
          <button id="use-decoded" class="secondary" disabled>用此内容生成</button>
        </div>
      </div>
      <div id="message" class="message"></div>
    </section>
  </main>
  <script src="qrcode.min.js"></script>
  <script src="../../assets/vendor/jsQR.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'"></script>
  <script src="../../assets/js/share.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="qr-code"></script>
</body>
</html>
