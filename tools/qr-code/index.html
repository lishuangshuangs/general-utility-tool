<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码生成器 - Utilora</title><link rel="stylesheet" href="../../assets/css/site.css"><style>#qr{display:grid;min-height:260px;margin-top:18px;place-items:center;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px}#qr img,#qr canvas{max-width:100%;padding:12px;background:#fff}</style></head><body><header class="tool-head"><nav><a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a><a href="../../">返回首页</a></nav></header><main class="tool-main"><section class="panel"><h1>二维码生成器</h1><p class="hint">输入文本或链接生成二维码。内容在浏览器中处理，不会上传。</p><div class="field"><label for="content">文本或网址</label><textarea id="content" placeholder="https://utilora.github.io/"></textarea></div><div class="grid"><div><label for="size">尺寸</label><select id="size"><option>200</option><option selected>256</option><option>320</option><option>400</option></select></div><div><label for="level">容错等级</label><select id="level"><option value="L">低</option><option value="M" selected>中</option><option value="Q">较高</option><option value="H">高</option></select></div></div><div class="actions"><button id="generate">生成二维码</button><button id="download" class="secondary">下载 PNG</button></div><div id="message" class="message"></div><div id="qr">等待输入内容</div></section></main><script src="qrcode.min.js"></script><script src="tool.js"></script></body></html>
