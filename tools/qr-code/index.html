<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码生成器 - Utilora</title><link rel="stylesheet" href="../../assets/css/site.css"><style>#qr{display:grid;min-height:280px;margin-top:18px;place-items:center;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;overflow:auto}#qr canvas{max-width:100%;height:auto}.file-note{margin-top:6px;color:#64748b;font-size:12px}</style></head><body><header class="tool-head"><nav><a class="brand" href="../../"><span class="brand-mark">U</span>Utilora</a><a href="../../">返回首页</a></nav></header><main class="tool-main"><section class="panel"><h1>二维码生成器</h1><p class="hint">输入文本或链接生成二维码，可添加中心 Icon 和边框。内容与图片仅在浏览器中处理。</p><div class="field"><label for="content">文本或网址</label><textarea id="content" placeholder="https://utilora.github.io/"></textarea></div><div class="grid"><div><label for="size">尺寸</label><select id="size"><option>200</option><option selected>256</option><option>320</option><option>400</option></select></div><div><label for="level">容错等级</label><select id="level"><option value="L">低</option><option value="M">中</option><option value="Q">较高</option><option value="H" selected>高（推荐加 Icon）</option></select></div><div><label for="border-style">边框</label><select id="border-style"><option value="none">无边框</option><option value="square" selected>白色方形边框</option><option value="rounded">白色圆角边框</option><option value="dark">深色方形边框</option></select></div><div><label for="icon">中心 Icon（可选）</label><input id="icon" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="file-note">建议使用正方形 PNG，Icon 会覆盖二维码约 18%。</div></div></div><div class="actions"><button id="generate">生成二维码</button><button id="remove-icon" class="secondary" type="button">移除 Icon</button><button id="download" class="secondary">下载 PNG</button></div><div id="message" class="message"></div><div id="qr">等待输入内容</div></section></main><script src="qrcode.min.js"></script><script src="tool.js"></script><script src="../../assets/js/analytics.js" data-tool="qr-code"></script></body></html>
