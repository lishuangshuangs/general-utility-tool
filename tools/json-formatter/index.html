<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON 格式化 - Utilora</title>
  <meta name="description" content="在浏览器中格式化、压缩、校验并下载 JSON，不上传内容。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>JSON 格式化</h1>
      <p class="hint">格式化、压缩、按 key 排序并校验 JSON。内容只在你的浏览器里处理。按 <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 快速格式化。</p>
      <textarea id="input" spellcheck="false" placeholder='{"name":"Utilora"}'></textarea>
      <div class="actions">
        <button data-space="2">格式化</button>
        <button data-space="0">压缩</button>
        <button id="sort" class="secondary">排序 key</button>
        <button id="sample" class="secondary">示例</button>
        <button id="copy" class="secondary">复制</button>
        <button id="download" class="secondary">下载</button>
        <button id="clear" class="secondary">清空</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../jwt-decoder/">JWT 解码</a>
      <a href="../base64/">Base64 编解码</a>
      <a href="../text-diff/">文本对比</a>
    </div>
  </main>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="json-formatter"></script>
</body>
</html>
