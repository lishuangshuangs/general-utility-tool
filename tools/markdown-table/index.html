<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Markdown 表格对齐 - Utilora</title>
  <meta name="description" content="粘贴或输入 Markdown 表格，本地对齐列宽并美化输出，支持左中右对齐。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <style>
    .split-area{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .split-area textarea{min-height:240px;font-family:ui-monospace,monospace;font-size:13px}
    @media(max-width:700px){.split-area{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>Markdown 表格对齐</h1>
      <p class="hint">粘贴杂乱的 Markdown 表格或用 | 分隔的文本，一键对齐列宽。可选择左对齐、居中或右对齐。处理仅在浏览器内进行。</p>
      <div class="field">
        <label for="align">对齐方式</label>
        <select id="align">
          <option value="left">左对齐</option>
          <option value="center">居中</option>
          <option value="right">右对齐</option>
        </select>
      </div>
      <div class="split-area">
        <div class="field">
          <label for="input">输入</label>
          <textarea id="input" placeholder="| 姓名 | 年龄 | 城市 |\n| --- | --- | --- |\n| 张三 | 28 | 上海 |\n| 李四 | 31 | 北京 |"></textarea>
        </div>
        <div class="field">
          <label for="output">对齐结果</label>
          <textarea id="output" readonly placeholder="对齐后的表格将显示在此"></textarea>
        </div>
      </div>
      <div class="actions">
        <button id="run" type="button">对齐表格</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
        <button id="sample" class="secondary" type="button">填入示例</button>
        <button id="clear" class="secondary" type="button">清空</button>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../markdown-preview/">Markdown 预览</a>
      <a href="../text-counter/">文本统计</a>
      <a href="../json-formatter/">JSON 格式化</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="markdown-table"></script>
</body>
</html>
