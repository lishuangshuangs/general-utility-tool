<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>列表格式转换 - Utilora</title>
  <meta name="description" content="在换行、逗号、分号、JSON 数组等列表格式间互转，本地处理不上传。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../../">Utilora</a>
      <a href="../../feedback/">功能建议</a>
    </nav>
  </header>
  <main class="tool-main">
    <div class="panel">
      <h1>列表格式转换</h1>
      <p class="hint">将一行一个、逗号分隔、分号分隔或 JSON 数组等形式的列表互相转换，并支持去空、去重。内容仅在浏览器内处理。</p>
      <div class="field">
        <label for="input">输入列表</label>
        <textarea id="input" placeholder="粘贴列表，例如：&#10;苹果&#10;香蕉&#10;橙子&#10;或 苹果,香蕉,橙子"></textarea>
      </div>
      <div class="grid">
        <div class="field">
          <label for="from">输入格式</label>
          <select id="from">
            <option value="auto">自动识别</option>
            <option value="newline">换行分隔</option>
            <option value="comma">逗号分隔</option>
            <option value="semicolon">分号分隔</option>
            <option value="space">空格分隔</option>
            <option value="json">JSON 数组</option>
          </select>
        </div>
        <div class="field">
          <label for="to">输出格式</label>
          <select id="to">
            <option value="newline">换行分隔</option>
            <option value="comma">逗号分隔</option>
            <option value="comma-space">逗号+空格</option>
            <option value="semicolon">分号分隔</option>
            <option value="json">JSON 数组</option>
            <option value="markdown">Markdown 列表</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-right:12px">
          <input id="trim" type="checkbox" checked> 去除空白
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-right:12px">
          <input id="unique" type="checkbox"> 去重
        </label>
        <button id="convert" type="button">转换</button>
        <button id="copy" class="secondary" type="button">复制结果</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="output">输出</label>
        <textarea id="output" readonly spellcheck="false" placeholder="转换结果将显示在此处"></textarea>
      </div>
      <div id="message" class="message"></div>
    </div>
    <div class="related">
      <span>相关工具</span>
      <a href="../text-dedupe/">文本去重</a>
      <a href="../text-counter/">文本统计</a>
      <a href="../json-formatter/">JSON 格式化</a>
    </div>
  </main>
  <script src="../../assets/js/app.js"></script>
  <script src="tool.js"></script>
  <script src="../../assets/js/analytics.js" data-tool="list-converter"></script>
</body>
</html>
